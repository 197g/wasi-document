<html>
	<head>
		<meta itemprop=wasi-document content=init-declarative />
		<meta itemprop=wasi-document content=wasi-document-output />

		<template class=wasi-document-process data-process=chksum>
			<div itemprop=args>bin/coreutils.wasm</div>
			<div itemprop=args>sha256sum</div>
			<div itemprop=args>bin/coreutils.wasm</div>
			<div itemprop=args>etc/wasi-release</div>
			<span itemprop=fd data-fd=1></span>
		</template>
	</head>
	<script>document.addEventListener('wasi-process-settled', console.info)</script>
	<body>
		<wasi-document-output data-wasi-process=chksum command=event>
		</wasi-document-output>
	</body>
</html>
